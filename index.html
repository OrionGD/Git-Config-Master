<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Biosphere | Gamified Environmental Learning Hub</title>
    <meta name="description" content="A premium, state-aware gamified learning environment for mastering Git configuration biomes.">
    <link rel="icon" type="image/png" href="/logo.png">
    <script>
        // Temporarily intercept console warnings to suppress the Tailwind CDN warning
        (function() {
            const originalWarn = console.warn;
            const originalLog = console.log;
            console.warn = function(...args) {
                if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
                originalWarn.apply(console, args);
            };
            console.log = function(...args) {
                if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
                originalLog.apply(console, args);
            };
            window.__restoreConsole = function() {
                console.warn = originalWarn;
                console.log = originalLog;
                delete window.__restoreConsole;
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.__restoreConsole) window.__restoreConsole();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

        tailwind.config = {
